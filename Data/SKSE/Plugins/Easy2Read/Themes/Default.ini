; Easy2Read theme. Presets are the .ini files in SKSE/Plugins/Easy2Read/Themes;
; add your own there and they appear in SKSE Menu Framework 3 under Easy2Read > Theme.
; Your theme is SKSE/Plugins/Easy2Read_Theme.ini. Without it, the Default preset is used.
; Loading a preset or editing in the menu applies live; Save INI writes Easy2Read_Theme.ini
; and never modifies preset files. Reload INI discards unsaved edits.

[Font]
; Font preset: Barlow, Sovngarde, Dyslexic, ImGui, or Custom
; Barlow = Barlow Condensed Regular (default, requires BarlowCondensed-Regular.ttf in Easy2Read folder)
; Sovngarde = Skyrim-themed font (requires Sovngarde-Bold.ttf in Easy2Read folder)
; Dyslexic = OpenDyslexic font (requires OpenDyslexic-Regular.otf in Easy2Read folder)
; ImGui = Built-in ImGui default font (no font file needed)
; Custom = Uses the CustomFontFile path below
FontPreset = Barlow

; Path to custom font file (only used when FontPreset = Custom)
; Path is relative to Skyrim's Data folder
CustomFontFile = SKSE/Plugins/Easy2Read/CustomFont.ttf

; Font size in pixels (for body text)
FontSize = 30

; Title scale multiplier (1.0 = same as body, 1.2 = 20% larger)
TitleScale = 1.2

; Language/Unicode support level - controls which character sets are loaded
; Higher levels use more RAM but support more languages
; Latin = Basic Latin only (~0.5 MB) - English, basic Western European
; European = Latin + Cyrillic + Greek (~2-4 MB) - Full European language support (default)
; Asian = European + CJK common (~10-20 MB) - Chinese/Japanese/Korean common characters
; Full = All available glyphs (~50-100 MB) - Maximum Unicode coverage
LanguageSupport = European

[Colors]
; Colors are specified as RGB values (0-255)

; Title text color (white, matching Skyrim menus)
TitleColorR = 255
TitleColorG = 255
TitleColorB = 255

; Body text color
BodyColorR = 255
BodyColorG = 255
BodyColorB = 255

; Window background color
WindowColorR = 0
WindowColorG = 0
WindowColorB = 0

; Window border color
BorderColorR = 160
BorderColorG = 160
BorderColorB = 160
BorderSize = 1.0

; Separator line color (between title and body)
SeparatorColorR = 140
SeparatorColorG = 140
SeparatorColorB = 140

[Scrollbar]
; Scrollbar background color
BackgroundColorR = 25
BackgroundColorG = 25
BackgroundColorB = 25

; Scrollbar thumb (handle) color
ThumbColorR = 160
ThumbColorG = 160
ThumbColorB = 160

; Scrollbar thumb hover color
ThumbHoverColorR = 210
ThumbHoverColorG = 210
ThumbHoverColorB = 210

; Scrollbar size and style
Size = 10
Rounding = 0

; Scroll speed (pixels per scroll wheel tick)
ScrollSpeed = 50

[Window]
; Window dimensions as percentage of screen size (0-100)
WidthPercent = 50
HeightPercent = 70

; Window corner rounding in pixels
Rounding = 0

; Padding inside window in pixels
Padding = 32

[Visibility]
; Toggle visibility of UI elements (true/false)

; Show the book title at the top of the overlay
ShowTitle = true

; Center the book title; long titles wrap within the available width
CenterTitle = true

; Show the separator line between title and body text
ShowSeparator = true

; Show the window border
ShowBorder = true

; Show the scrollbar track/background
ShowScrollbarTrack = true

; Use SkyUI message-box border artwork (requires ShowBorder = true)
; BorderSize scales the artwork; 1.0 preserves its native proportions at 1080p
; Border lines retain consistent opacity through their joins with the corners
ShowCornerOrnaments = true

[Transparency]
; Per-element transparency (0-100, where 100 is fully opaque)
; Note: Text transparency is not configurable - text always renders at full opacity

; Window background transparency
WindowAlpha = 90

; Border transparency
BorderAlpha = 85

; Separator line transparency
SeparatorAlpha = 75

; Scrollbar track/background transparency
ScrollbarTrackAlpha = 50

; Scrollbar thumb (handle) transparency
ScrollbarThumbAlpha = 100
